<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b1536" />
      <stop offset="100%" stop-color="#0d1b2a" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9b51e0" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.03); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes ecgMove {
        0% { stroke-dashoffset: 2000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes rotateSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-badge {
        animation: float 5s ease-in-out infinite;
      }
      .ecg-line {
        stroke-dasharray: 2000;
        animation: ecgMove 8s linear infinite;
      }
      .rotating-gear {
        animation: rotateSlow 25s linear infinite;
        transform-origin: 1050px 180px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#00f2fe" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" />
  </g>

  <!-- Glowing Animated Ambient Orbs -->
  <circle cx="200" cy="80" r="140" fill="url(#glow-grad)" class="pulse-circle" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="180" fill="url(#accent-grad)" class="pulse-circle" opacity="0.12" filter="url(#glow)" />

  <!-- Animated Pharmacovigilance ECG / Safety Waveform -->
  <path class="ecg-line" d="M 0,270 L 320,270 L 340,240 L 355,305 L 375,215 L 390,285 L 410,270 L 750,270 L 770,230 L 785,310 L 805,200 L 825,290 L 845,270 L 1200,270" fill="none" stroke="url(#primary-grad)" stroke-width="2.5" opacity="0.6" filter="url(#soft-glow)" />

  <!-- Decorative Orbiting Graphic on the Right -->
  <g class="rotating-gear" opacity="0.25">
    <circle cx="1050" cy="180" r="110" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="10 8" />
    <circle cx="1050" cy="180" r="85" fill="none" stroke="#38ef7d" stroke-width="1" stroke-dasharray="6 6" />
    <circle cx="1050" cy="180" r="60" fill="none" stroke="#9b51e0" stroke-width="1.5" stroke-dasharray="12 4" />
  </g>

  <!-- Central Shield / Pharmacovigilance Icon Badge -->
  <g class="floating-badge" transform="translate(1000, 130)">
    <polygon points="50,10 90,30 90,80 50,110 10,80 10,30" fill="#0c2340" stroke="url(#primary-grad)" stroke-width="2.5" filter="url(#glow)" />
    <!-- Rx / Medical Caduceus / Cross -->
    <path d="M 50,35 L 50,75 M 35,50 L 65,50 M 42,42 L 58,58 M 58,42 L 42,58" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" />
    <!-- Signal Ring -->
    <circle cx="50" cy="50" r="28" fill="none" stroke="#38ef7d" stroke-width="1.5" stroke-dasharray="4 3" />
  </g>

  <!-- Header Category Tag -->
  <g transform="translate(80, 75)">
    <rect width="360" height="32" rx="16" fill="#132743" stroke="#00f2fe" stroke-width="1" opacity="0.9"/>
    <circle cx="16" cy="16" r="5" fill="#38ef7d" filter="url(#soft-glow)" />
    <text x="32" y="21" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">DRUG SAFETY &amp; PHARMACOVIGILANCE</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(80, 160)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome <tspan fill="url(#primary-grad)">Pharmacovigilance</tspan>
    </text>
  </g>

  <!-- Subtitle / Mission Statement -->
  <g transform="translate(80, 205)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
      Curated ecosystem of SaaS platforms, AI signal detection, ICSR pipelines, and open-source tools
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(80, 240)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="135" height="28" rx="14" fill="#0f2b48" stroke="#4facfe" stroke-width="1" />
      <text x="14" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ ICSR &amp; Safety</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(145, 0)">
      <rect width="165" height="28" rx="14" fill="#0f2b48" stroke="#38ef7d" stroke-width="1" />
      <text x="14" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 Signal Detection</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(320, 0)">
      <rect width="165" height="28" rx="14" fill="#0f2b48" stroke="#00c6ff" stroke-width="1" />
      <text x="14" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤖 Biomedical NLP</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(495, 0)">
      <rect width="165" height="28" rx="14" fill="#0f2b48" stroke="#9b51e0" stroke-width="1" />
      <text x="14" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 Real-World Data</text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#primary-grad)" rx="3" />
</svg>
